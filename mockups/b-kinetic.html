<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ethan Wong — B · Kinetic</title>
<meta name="description" content="Ethan Wong — bringing products to life.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap">

<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/page.css">

<style>
/* ============================================================
   B — KINETIC
   Energetic. Many small pieces across the whole viewport that
   swarm inward and lock into built forms — cubes, arches, stacks.
   The forms stay put afterwards and drift on scroll.
   ============================================================ */

body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  --hero-pad: clamp(1.75rem, 5vw, 4rem);
  --card-radius: 18px;
}

.hero__name,
.nav__mark,
.band__title,
.card__title,
.lede,
.contact__mail,
.hero__tagline {
  font-family: 'Sora', system-ui, sans-serif;
}

/* one line, tight, product-y */
.hero__name {
  --name-weight: 800;
  --name-track: -0.055em;
  --name-size: clamp(2.6rem, 11vw, 8.5rem);
  line-height: .95;
}
.hero__name span { display: inline; }
.hero__name span + span { margin-left: .12em; }

.hero__tagline {
  font-size: clamp(1.05rem, 3vw, 1.7rem);
  font-weight: 400;
  letter-spacing: -.02em;
  margin-top: clamp(.85rem, 2vw, 1.35rem);
}
.life { font-weight: 800; }

/* the word gets a soft halo once it's gold — it is the epicentre */
.warm .life::after,
html.is-warm .life::after {
  content: "";
  position: absolute;
  inset: -.55em -.7em;
  border-radius: 999px;
  background: radial-gradient(closest-side, rgba(221,166,70,.20), transparent 72%);
  z-index: -1;
}

.hero__blurb { max-width: 44ch; font-size: var(--step-0); }

.hero__actions { gap: .55rem; }
.btn { border-radius: 12px; letter-spacing: .02em; text-transform: none; font-weight: 600; }

/* --- sections --- */
.band__title { font-weight: 700; letter-spacing: -.035em; }
.band__num {
  padding: .3em .6em;
  border-radius: 8px;
  background: var(--gold-wash);
  border: 1px solid var(--gold-soft);
}

.lede { font-weight: 600; letter-spacing: -.03em; }

/* two-up card grid, filled and rounded */
@media (min-width: 860px) { .cards { grid-template-columns: 1fr 1fr; } }
.card {
  --card-bg: color-mix(in srgb, var(--paper-2) 45%, transparent);
  border-color: transparent;
  background: var(--card-bg);
}
.card:hover {
  border-color: var(--gold-soft);
  background: color-mix(in srgb, var(--gold-wash) 55%, transparent);
}
.card__title { letter-spacing: -.03em; }
.tag { border-radius: 8px; font-weight: 600; }

.skills__col li {
  display: inline-block;
  margin: 0 .35rem .45rem 0;
  padding: .3em .7em;
  border-radius: 8px;
  background: var(--paper-2);
  font-size: .8rem;
}
.contact__mail { font-weight: 700; letter-spacing: -.045em; }
</style>
</head>

<body>

<nav class="nav" aria-label="Primary">
  <a class="nav__mark" href="#top">Ethan Wong<span>.</span></a>
  <ul class="nav__links">
    <li><a href="#work">Work</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<main id="top">

  <section class="hero" aria-label="Ethan Wong">
    <canvas class="shards" aria-hidden="true"></canvas>
    <div class="hero__ring" aria-hidden="true"></div>
    <button class="hero__trigger" type="button">Reveal the page</button>

    <div class="hero-inner">
      <h1 class="hero__name"><span>Ethan</span><span>Wong</span></h1>
      <p class="hero__tagline">bringing products to <em class="life">life</em></p>
      <p class="hero__blurb"></p>
      <div class="hero__actions"></div>
    </div>

    <div class="hero__cue hero__cue--tap" aria-hidden="true">
      <span class="pulse"></span>
      <span>click anywhere</span>
    </div>
    <div class="hero__cue hero__cue--scroll" aria-hidden="true">
      <span>scroll</span>
      <span class="hero__cue-line"></span>
    </div>
  </section>

  <div class="page" id="page"></div>
</main>

<script src="shared/content.js"></script>
<script src="shared/shards.js"></script>
<script>
(function () {
  var C = window.CONTENT;

  document.querySelector('.hero__blurb').textContent = C.blurb;
  document.querySelector('.hero__actions').innerHTML = C.actions.map(function (a) {
    return '<a class="btn' + (a.kind === 'primary' ? ' btn--primary' : '') +
           '" href="' + a.href + '">' + a.label + '</a>';
  }).join('');

  window.renderPage(document.getElementById('page'));

  window.initHero({
    seed: 29,

    /* many small forms ringing the viewport — the middle stays clear
       for the name, but the edges are busy and alive.
       narrow:false = dropped on phones, where there is no margin to spare */
    shapes: [
      { shape: 'cube',   size: 0.115, x: 0.09, y: 0.16 },
      { shape: 'stairs', n: 4, size: 0.13,  x: 0.24, y: 0.14,  narrow: false },
      { shape: 'tri',    size: 0.10,  x: 0.50, y: 0.15,  narrow: false },
      { shape: 'bars',   n: 5, size: 0.14,  x: 0.76, y: 0.145, narrow: false },
      { shape: 'cube',   size: 0.125, x: 0.92, y: 0.22 },
      { shape: 'arch',   n: 5, size: 0.145, x: 0.90, y: 0.62 },
      { shape: 'tri',    size: 0.095, x: 0.955, y: 0.87, narrow: false },
      { shape: 'stairs', n: 4, size: 0.135, x: 0.72, y: 0.93 },
      { shape: 'bars',   n: 5, size: 0.13,  x: 0.27, y: 0.94 },
      { shape: 'arch',   n: 5, size: 0.13,  x: 0.07, y: 0.75, narrow: false },
      { shape: 'cube',   size: 0.10,  x: 0.045, y: 0.45, narrow: false }
    ],

    palette: [
      '#DDA646', '#C98A3A', '#B26F3C', '#E8C888',
      '#A9832F', '#D2A04A', '#C4653A', '#EBD9AE'
    ],

    scatter:    [0.28, 0.75],
    startScale: [0.35, 0.9],
    spin:       3.4,
    drift:      1.5,
    corner:     0.05,

    lineWidth:       1,
    stroke:          '#B9B3A6',
    strokeWarm:      '#B0862E',
    strokeAlpha:     0.6,
    strokeAlphaWarm: 0.3,
    fillAlpha:       0.95,

    waveMs:     950,
    assembleMs: 780,
    parallax:   0.14,
    autoFireMs: 3000
  });

  var nav = document.querySelector('.nav');
  window.addEventListener('scroll', function () {
    nav.classList.toggle('is-stuck', window.scrollY > 40);
  }, { passive: true });
})();
</script>
</body>
</html>
